services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: agripredict
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  producer:
    build: .
    command: python producer.py
    environment: { KAFKA_BOOTSTRAP: "kafka:29092" }
    depends_on: { kafka: { condition: service_healthy } }

  consumer:
    build: .
    command: python consumer.py
    environment: { KAFKA_BOOTSTRAP: "kafka:29092", DB_PATH: /shared/predictions.db }
    volumes: [shared:/shared]
    depends_on: { kafka: { condition: service_healthy } }

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment: { DB_PATH: /shared/predictions.db, HIVE_HOST: hive, HIVE_PORT: "10000" }
    volumes: [shared:/shared]
    ports: ["8501:8501"]
    depends_on: [consumer]

  hive:
    image: apache/hive:4.0.0
    container_name: hive
    environment:
      SERVICE_NAME: hiveserver2
    ports: ["10000:10000", "10002:10002"]
    volumes: [warehouse:/opt/hive/data/warehouse]

  hive-sink:
    build: .
    command: python hive_sink.py
    environment: { KAFKA_BOOTSTRAP: "kafka:29092", HIVE_HOST: hive, HIVE_PORT: "10000" }
    depends_on: { kafka: { condition: service_healthy }, hive: { condition: service_started } }

volumes:
  shared:
  warehouse:
